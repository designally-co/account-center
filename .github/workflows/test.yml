name: Tests
on:
  push:
  pull_request:
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Project Friday runs PostgreSQL 17.
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test schema account on a throwaway database
        run: test/run.sh "postgresql://postgres@localhost:5432/postgres"

  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: App tests against schema account
        run: npm test
        env:
          TEST_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
