name: Release

# Account Center's image for the Designally NAS (docs/deploy-nas.md).
#
#   Every pull request   the image is built for linux/amd64 and started against a
#                        throwaway PostgreSQL 17 with schema `account`, as
#                        Account Center's own user; /api/health and the sign-in
#                        redirect are checked. Nothing is pushed.
#   A release-* tag      the same, then the image that passed is pushed to GHCR
#   (or a manual run     as sha-<full commit>, never latest, and the image,
#   on main)             digest and commit are written to the run summary.
#
# Nothing here deploys. The NAS changes only when a person points the Portainer
# stack at a new IMAGE_TAG.

on:
  pull_request:
  push:
    tags: ["release-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/designally-co/account-center
  # The commit the image is built from: the branch head on a pull request (not
  # GitHub's merge commit), the tagged or dispatched commit otherwise.
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/release-') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  image:
    name: Image (linux/amd64)
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Project Friday runs PostgreSQL 17. A throwaway database for this job only.
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LOCAL_TAG: account-center:ci
      ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Schema account on the throwaway database
        run: |
          psql -X -q -v ON_ERROR_STOP=1 "$ADMIN_URL" -f test/stand-ins.sql
          for m in supabase/migrations/*.sql; do psql -X -q -v ON_ERROR_STOP=1 "$ADMIN_URL" -1 -f "$m"; done
          # The same login the NAS uses (sql/account-app-user.sql), with a throwaway password.
          psql -X -q -v ON_ERROR_STOP=1 "$ADMIN_URL" -c "alter role account_app with login password 'ci-throwaway'"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: APP_COMMIT_SHA=${{ env.COMMIT }}
          tags: ${{ env.LOCAL_TAG }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Architecture and health check are baked in
        run: |
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$LOCAL_TAG")"
          echo "platform: $platform"
          test "$platform" = "linux/amd64"
          docker image inspect --format '{{json .Config.Healthcheck}}' "$LOCAL_TAG" | grep -q '/api/health'

      - name: No credential-shaped strings in the image history
        run: |
          if docker history --no-trunc --format '{{.CreatedBy}}' "$LOCAL_TAG" \
            | grep -Eq 'sk-ant-|sb_secret_|AKIA[0-9A-Z]{16}|postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@'; then
            echo "::error::A credential-shaped string is in the image history."
            exit 1
          fi

      - name: The app starts as account_app and answers
        run: |
          # SUPABASE_URL points at a closed port: nobody can sign in, so every page must send people to /login.
          docker run -d --name smoke --network host \
            -e DATABASE_URL="postgresql://account_app:ci-throwaway@127.0.0.1:5432/postgres" \
            -e SUPABASE_URL="http://127.0.0.1:9" \
            -e SUPABASE_PUBLISHABLE_KEY="ci-placeholder" \
            "$LOCAL_TAG"
          for attempt in $(seq 1 30); do
            if curl -s -o health.json http://127.0.0.1:3000/api/health; then break; fi
            sleep 2
          done
          cat health.json; echo
          jq -e --arg c "$COMMIT" '.ok == true and .commit == $c and .apps > 0' health.json
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:3000/people)" = "307 http://127.0.0.1:3000/login"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = "200"
          curl -sI http://127.0.0.1:3000/login | grep -qi '^x-frame-options: DENY'
          curl -sI http://127.0.0.1:3000/login | grep -qi "^content-security-policy: frame-ancestors 'none'"

      - name: Server log on failure
        if: failure()
        run: docker logs smoke 2>&1 | tail -80 || true

      - name: Keep the tested image for publishing
        if: env.RELEASE == 'true'
        run: docker save "$LOCAL_TAG" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: image
          path: image.tar.gz
          retention-days: 7

  publish:
    # A fixed name: on a pull request this job is skipped.
    name: Publish to GHCR
    needs: image
    if: startsWith(github.ref, 'refs/tags/release-') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The commit is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::$COMMIT is not on main. Release only reviewed, merged commits."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: image

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag account-center:ci "$IMAGE:sha-$COMMIT"
          docker push "$IMAGE:sha-$COMMIT"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$COMMIT")"
          {
            echo "### Account Center release image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE:sha-$COMMIT\` |"
            echo "| Digest | \`$digest\` |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Platform | linux/amd64 |"
            echo ""
            echo "Portainer: set \`IMAGE_TAG=sha-$COMMIT\` (docs/deploy-nas.md)."
          } >> "$GITHUB_STEP_SUMMARY"
